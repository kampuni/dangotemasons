<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 – Page Not Found | Dangote Masons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Auto redirect after 10 seconds -->
  <meta http-equiv="refresh" content="10;url=/" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f4;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      background: #fff;
      padding: 50px 30px;
      max-width: 520px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 52px;
      margin: 0;
      color: #000;
    }
    h2 {
      margin-top: 10px;
      font-size: 22px;
    }
    p {
      color: #555;
      line-height: 1.6;
      margin-top: 15px;
    }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    .btn.secondary {
      background: #444;
      margin-left: 10px;
    }
    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>

    <p>
      The page you’re trying to access doesn’t exist or may have been moved.
      Dangote Masons is still active and ready to handle your construction needs.
    </p>

    <a href="/" class="btn">View Our Services</a>
    <a href="/#contact" class="btn secondary">Contact Us</a>

    <p class="note">
      You’ll be redirected to the homepage shortly.
    </p>
  </div>
</body>
</html>
